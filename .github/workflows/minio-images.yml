name: Shared MinIO images

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'containers/minio/**'
      - '.github/workflows/minio-images.yml'

concurrency:
  group: shared-minio-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and check native images
        env:
          MINIO_IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}
        run: |
          python3 containers/minio/build.py --load --all --namespace "${MINIO_IMAGE_NAMESPACE,,}"
          python3 containers/minio/smoke.py --namespace "${MINIO_IMAGE_NAMESPACE,,}"
      - name: Build and publish pinned AMD64 and ARM64 images
        env:
          MINIO_IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}
        run: python3 containers/minio/build.py --push --all --namespace "${MINIO_IMAGE_NAMESPACE,,}"
